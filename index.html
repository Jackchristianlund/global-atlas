<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Atlas</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://jackchristianlund.github.io/global-atlas/" />
    <meta name="description" content="Interaktivt kart over pågående væpnede konflikter: territoriell kontroll, kildebelagt frontlinjegeometri, dokumenterte hendelser og fordrivelse. Hver vurdering vises med sin kilde og sin dato." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070B14" />

    <!-- Link previews. The image is a real screenshot of the running app, not
         a mock-up: a preview that promises something the page does not show is
         the first thing a reader learns not to trust. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Atlas" />
    <meta property="og:title" content="Global Atlas — konfliktkart med kilder" />
    <meta property="og:description" content="Territoriell kontroll, kildebelagt frontlinje og dokumenterte hendelser på klode og detaljkart. Hver vurdering med kilde og dato." />
    <!-- Absolute, because a crawler does not resolve a relative image and
         does not run the page's scripts. This names the public site; the
         artifact build is previewed by its own host. -->
    <meta property="og:url" content="https://jackchristianlund.github.io/global-atlas/" />
    <meta property="og:image" content="https://jackchristianlund.github.io/global-atlas/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Global Atlas: en 3D-klode med konfliktmarkører og territoriell kontroll, med filterpanel og nøkkeltall." />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Atlas — konfliktkart med kilder" />
    <meta name="twitter:description" content="Territoriell kontroll, kildebelagt frontlinje og dokumenterte hendelser. Hver vurdering med kilde og dato." />
    <meta name="twitter:image" content="https://jackchristianlund.github.io/global-atlas/og.jpg" />
    <!-- The typefaces are bundled rather than fetched: a published artifact
         cannot reach fonts.googleapis.com, so a link here would silently leave
         every reader on system fallbacks. OFL, see public/fonts/ui. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
