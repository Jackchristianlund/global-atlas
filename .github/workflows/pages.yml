# Builds the app and publishes it to GitHub Pages on every push to main.
#
# The build needs nothing but Node: every data file, font and glyph range is in
# the repository. What changes once it is served from here rather than from an
# artifact is that the app can finally reach the network, so the vector tile
# base map and the live front line query switch themselves on.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: on Node 20 the runner's undici throws
          # "Cannot read properties of undefined (reading 'bind')" while
          # loading its decompress interceptor, and the jsdom test workers
          # never start. The tests themselves are fine — they pass on 22.
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests are the point of having them; a broken build should not ship.
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
        # Optional, and empty unless set in the repository settings:
        # Settings → Secrets and variables → Actions. With none of them the
        # build is exactly as before. See docs/IMAGERY.md and docs/CONTROL.md.
        env:
          VITE_SATELLITE_PROVIDER: ${{ vars.VITE_SATELLITE_PROVIDER }}
          VITE_SATELLITE_KEY: ${{ secrets.VITE_SATELLITE_KEY }}
          VITE_SATELLITE_ATTRIBUTION: ${{ vars.VITE_SATELLITE_ATTRIBUTION }}
          # Set to 'off' to stop using ISW's control layer.
          VITE_ISW_CONTROL: ${{ vars.VITE_ISW_CONTROL }}
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repository if it is not already, so the
        # deployment does not need a visit to the settings page.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
